<html>
    <head>
        <title>Add Product Page</title>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <link rel = "stylesheet" href = "./Css/AddProductPageStyle.css">
    </head>
    
    <body>
        <form class = "add-product-form" action = "Add.jsp" method = "post">
            <h2>ADD NEW PRODUCT TO YOUR WISH LIST</h2>
            <div class = "form-group">
                <label for = "product-name">Name: </label>
                <input type = "text" id = "product-name" name = "product-name" required>
            </div>
   
            <div class = "form-group">
                <label for = "product-price">Price: </label>
                <input type = "number" id = "product-price" name = "product-price" required>
            </div>
    
            <span>Status</span> <select id = "status" name = "status"> 
                <option value = "In stock">In stock</option>
                <option value = "Out of stock">Out of stock</option>
            </select><br><br>
   
            <button style = "border-radius: 10px; width: 50%; margin-left: 100px;" type = "submit">ADD</button>
        </form>
        
        <div class = "return">
            <a style = "color: black;" href = "WishListPage.jsp">Return</a>
        </div>
    </body>
</html>
